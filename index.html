<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件积木 · 肌理选择器</title>
<style>
:root{ --accent:#eab308; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; background:#0f1115; color:#e5e7eb; }
header{ position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:10px 16px; background:#13151b; border-bottom:1px solid #23262e; flex-wrap:wrap; }
header h1{ font-size:16px; margin:0; font-weight:600; }
header .sub{ font-size:11px; color:#8b93a7; }
.spacer{ flex:1; }
.btn{ cursor:pointer; border:1px solid #2a2f3d; background:#1a1e28; color:#e5e7eb; border-radius:8px; padding:6px 12px; font-size:12px; transition:.15s; }
.btn:hover{ border-color:var(--accent); color:var(--accent); }
#status{ font-size:12px; color:#9aa4bd; }
#status b{ color:var(--accent); }
.main{ display:grid; grid-template-columns:280px 1fr 380px; height:calc(100vh - 58px); }
aside{ padding:12px; overflow-y:auto; border-right:1px solid #23262e; background:#11141b; }
aside.right{ border-right:none; border-left:1px solid #23262e; }
section{ margin-bottom:16px; }
section h2{ font-size:11px; color:#7b8496; text-transform:uppercase; letter-spacing:1.5px; margin:0 0 8px; }
.theme-card{ border:1px solid #23262e; border-radius:10px; padding:9px 11px; margin-bottom:8px; cursor:pointer; transition:.15s; background:#14171f; }
.theme-card:hover{ border-color:#3a4152; transform:translateX(2px); }
.theme-card.active{ border-color:var(--accent); background:#181c26; box-shadow:0 0 0 1px var(--accent); }
.theme-card .t-name{ font-size:14px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
.theme-card .t-name .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.theme-card .t-tag{ font-size:11px; color:#8b93a7; margin-top:3px; }
details{ border:1px solid #23262e; border-radius:10px; background:#14171f; padding:8px 10px; }
summary{ cursor:pointer; font-size:12px; color:#b8c4e0; }
.wb{ margin-top:8px; }
.wb .g{ margin-bottom:8px; }
.wb .g .gl{ font-size:11px; color:#7b8496; margin-bottom:3px; }
.wb .g .gl b{ color:#9aa4bd; }
.chip{ display:inline-block; font-size:11px; padding:2px 7px; margin:1px 2px; border-radius:6px; background:#1d2130; color:#c7cbe0; border:1px solid #2a2f3d; }
.wb .g .sem{ font-size:10px; color:#6b7385; margin-top:2px; }
#detail{ border:1px solid #23262e; border-radius:10px; background:#14171f; padding:10px; font-size:12px; }
#detail .hint{ color:#7b8496; }
#detail .d-name{ font-size:14px; font-weight:600; }
#detail .d-type{ font-size:11px; margin:2px 0 6px; }
#detail .d-content{ font-size:14px; margin:6px 0; color:#f3f4f6; }
#detail .links{ margin-top:8px; }
#detail .links div{ font-size:11px; color:#8b93a7; margin:2px 0; }
#detail .links b{ color:#b8c4e0; }
ol#steps{ margin:0; padding-left:0; list-style:none; counter-reset:s; }
ol#steps li{ counter-increment:s; position:relative; padding:4px 0 4px 24px; font-size:12px; color:#6b7385; }
ol#steps li::before{ content:counter(s); position:absolute; left:0; top:4px; width:17px; height:17px; border-radius:50%; border:1px solid #2a2f3d; font-size:10px; text-align:center; line-height:15px; color:#7b8496; }
ol#steps li.done{ color:#9aa4bd; }
ol#steps li.done::before{ background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
ol#steps li.active{ color:#e5e7eb; }
ol#steps li.active::before{ background:var(--accent); border-color:var(--accent); color:#111; }
#stepProg{ margin-top:6px; font-size:11px; color:#8b93a7; min-height:16px; }
.center{ padding:10px; }
svg#graph{ width:100%; height:100%; background:#10131a; border-radius:10px; border:1px solid #23262e; display:block; }
.node{ cursor:pointer; }
.node .bg{ fill:#151923; stroke:#2a2f3d; stroke-width:1; }
.node .bg.fill{ fill:#171c28; }
.node .cls{ fill:#6f788c; font-size:11px; }
.node .cnt{ font-size:12.5px; fill:#55607a; }
.node.fill .cnt{ fill:#e5e7eb; }
.node .nid{ font-size:9.5px; fill:#4b5366; }
.node .nid .o{ fill:#3d4557; }
.node .lnk{ font-size:8.5px; fill:#8b93a7; }
.node .nm{ stroke-width:2.5; fill:none; opacity:0; }
.node.fill .nm{ opacity:1; }
.node.loop .bg{ stroke-dasharray:5 4; }
.node.sel .bg{ stroke:#ffffff; stroke-width:2; }
.edge{ stroke:#2c3446; stroke-width:1.6; fill:none; }
.edge.show{ stroke:#3d5066; stroke-width:1.8; }
.edge-label{ fill:#767f93; font-size:10.5px; }
.edge-label.show{ fill:#c7d1e3; }
.legend{ fill:#5c6577; font-size:10.5px; }
#recap{ border:1px solid #23262e; border-radius:10px; background:#14171f; padding:10px; margin-bottom:12px; font-size:12.5px; line-height:1.75; }
#recap .hint{ color:#7b8496; }
.fv{ color:var(--accent); font-weight:600; }
.r-combos{ margin:10px 0; }
.r-combo{ display:inline-block; font-size:11px; padding:2px 8px; margin:2px 2px 2px 0; border-radius:8px; background:#1a1f2c; border:1px dashed #3a4152; color:#c7cbe0; }
.r-steps{ margin:6px 0 0; padding-left:0; list-style:none; font-size:12px; counter-reset:rs; }
.r-steps li{ counter-increment:rs; margin:2px 0; color:#9aa4bd; }
.r-steps li::before{ content:counter(rs); display:inline-block; width:15px; height:15px; border-radius:50%; background:#1d2130; color:#7b8496; font-size:10px; text-align:center; line-height:15px; margin-right:6px; }
.r-steps b{ color:#d7e0f0; }
.r-sub{ font-size:11px; color:#7b8496; margin:4px 0 8px; }
.r-h{ font-size:11px; color:#8b93a7; margin:10px 0 4px; letter-spacing:1px; }
.r-pred{ color:var(--accent); font-size:11px; padding:0 4px; }
.r-tag{ color:#6b7385; font-size:10px; }
#jsonWrap{ display:flex; flex-direction:column; height:100%; }
#jsonBtns{ display:flex; gap:8px; margin-bottom:8px; }
pre#json{ flex:1; background:#0b0d12; border:1px solid #23262e; border-radius:10px; padding:10px; font-size:11px; line-height:1.5; font-family:Consolas,"Courier New",monospace; color:#b8c4e0; overflow:auto; margin:0; white-space:pre; }
.key{ color:#7dd3fc; } .str{ color:#a5d6a7; } .num{ color:#fcd34d; }
</style>
</head>
<body>
<header>
  <h1>事件积木 · 肌理选择器</h1>
  <span class="sub">原型骨架 × 主题肌理 = 演绎内容</span>
  <span class="spacer"></span>
  <span id="status">主题：<b>–</b> ｜ 阶段：–</span>
  <button class="btn" id="btnMode">🏗 骨架对照</button>
  <button class="btn" id="btnDice">🎲 抽主题</button>
  <button class="btn" id="btnReroll">🔀 换一套演绎</button>
  <button class="btn" id="btnPlay">▶ 播放过程</button>
  <button class="btn" id="btnCopy">⧉ 复制结构</button>
  <button class="btn" id="btnDl">⬇ 导出 JSON</button>
</header>
<div class="main">
  <aside class="left">
    <section>
      <h2>主题肌理库</h2>
      <div id="themes"></div>
    </section>
    <section>
      <h2>槽位词库（演绎词组）</h2>
      <details id="wordbank"><summary>展开 20 个槽位</summary><div class="wb" id="wb"></div></details>
    </section>
    <section>
      <h2>节点详情</h2>
      <div id="detail"><div class="hint">点击图中节点，查看类型 / 内容 / 入链与出链</div></div>
    </section>
    <section>
      <h2>过程展示</h2>
      <ol id="steps"><li>原型骨架就绪</li><li>命中主题</li><li>演绎词组填充</li><li>回环就绪 · 结构体导出</li></ol>
      <div id="stepProg"></div>
    </section>
  </aside>
  <main class="center">
    <svg id="graph" viewBox="0 0 1000 690" preserveAspectRatio="xMidYMid meet"></svg>
  </main>
  <aside class="right">
    <div id="jsonWrap">
      <h2>任务合述（{槽位} 组合演绎）</h2>
      <div id="recap"></div>
      <h2>最终结构（供游戏内逻辑消费）</h2>
      <div id="jsonBtns">
        <button class="btn" id="btnCopy2">⧉ 复制</button>
        <button class="btn" id="btnDl2">⬇ 下载</button>
      </div>
      <pre id="json">{"waiting": true}</pre>
    </div>
  </aside>
</div>

const SLOT = Object.fromEntries(SLOTS.map(s => [s.id, s]));
const LABEL = s => (Object.fromEntries(SLOTS.map(x => [x.type, x.label])))[s];

/* ---------- 布局 ---------- */
const W = 170, H = 86;
function chainPos(i, total){
  const row = Math.floor(i / 5), col = i % 5;
  const xc = (row % 2 === 1) ? (4 - col) : col;
  return { x: 90 + xc * 200, y: 115 + row * 255 };
}

/* ---------- 状态 ---------- */
let state = { mode:'roam', themeId:null, chain:[], edges:[], token:0, sel:null, roamLog:[], tplIdx:0 };

const theme = id => THEMES.find(t => t.id === id);
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const byTypeOf = t => { const m = {}; t.pool.forEach(n => (m[n.type] = m[n.type] || []).push(n)); return m; };
const nodeOf = (n, content) => ({ id:n.id, cat:n.type.split('·')[0], type:n.type, label:LABEL(n.type), content });

/* ---------- 随机漫游（逆序构建：后置定前置） ---------- */
function roam(themeId){
  const t = theme(themeId);
  const byType = byTypeOf(t);
  const log = [];
  const pickFree = (type, used) => {
    const list = (byType[type] || []).filter(n => !used.has(n.id));
    return list.length ? rand(list) : null;
  };
  const res = rand(byType['意义·结果'] || []), km = rand(byType['因果·业力'] || []);
  if(!res || !km){ return { chain:[], edges:[], log:['词池不足，无法漫游'] }; }
  const chain = [res, km], edges = [{ from:res.id, to:km.id, pred:predOf(res, km) }];
  const used = new Set([res.id, km.id]);
  log.push(`[收束] 先定结局：${res.type}「${res.content}」→ ${km.type}「${km.content}」（后置）`);

  const midLen = 4 + Math.floor(Math.random() * 3);
  for(let i = 0; i < midLen; i++){
    const head = chain[0];
    const nextType = chain[1] ? chain[1].type : null;
    let cands = t.pool.filter(n => !used.has(n.id) && (LINK[n.type] || []).includes(head.type));
    const mixed = cands.filter(n => n.type !== nextType);
    if(mixed.length) cands = mixed;
    if(!cands.length){
      log.push(`[剪枝] 无节点可连入「${head.type}」，提前收束（当前链长 ${chain.length}）`);
      break;
    }
    const n = rand(cands);
    chain.unshift(n);
    edges.unshift({ from:n.id, to:head.id, pred:predOf(n, head) });
    used.add(n.id);
    log.push(`[漫游] ${n.type}「${n.content}」→ ${head.type}（候选 ${cands.length} 个）`);
  }

  const tail = chain[chain.length - 1];
  const ev = pickFree('实体·事件', used);
  if(ev && (LINK[tail.type] || []).includes('实体·事件')){
    chain.push(ev); edges.push({ from:tail.id, to:ev.id, pred:predOf(tail, ev) }); used.add(ev.id);
    log.push(`[回环] ${tail.type}「${tail.content}」→ 事件「${ev.content}」`);
    const req2 = pickFree('意义·需求', used);
    if(req2 && (LINK[ev.type] || []).includes('意义·需求')){
      chain.push(req2); edges.push({ from:ev.id, to:req2.id, pred:predOf(ev, req2) }); used.add(req2.id);
      log.push(`[回环] 事件 → 新需求「${req2.content}」，链可再生长`);
    }
  } else {
    log.push(`[剪枝] 无可回环事件节点`);
  }
  return { chain: chain.map(n => nodeOf(n, rand(n.words))), edges, log };
}

function buildDemo(themeId){
  const t = theme(themeId);

  const demoTypes = ['req','env','npc','org','item','cnt','time','limit','skill','act','obs','clue','choice','cst','res','karma','weird','evt','sta','loc'];

  const req2 = { id:'req2', cat:'意义', type:'意义·需求', label:'新需求节点（回环锚）', content:first('意义·需求') };

  ];
const E = EDGES.map(x => ({ from:x.from, to:x.to, pred:x.pred }));

/* ---------- 渲染 ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(name, attrs, content, parent){
  const n = document.createElementNS(NS, name);
  for(const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if(typeof content === 'string') n.textContent = content;
  else if(content) content.appendChild(n);
  if(parent) parent.appendChild(n);
  return n;
}

function render(){
  const svg = $('#graph');
  svg.innerHTML = '';
  const defs = el('defs', {}, null, svg);
  const marker = el('marker', { id:'arrow', viewBox:'0 0 10 10', refX:'8.5', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse' }, null, defs);
  el('path', { d:'M0,0L10,5L0,10z', fill:'#3a4152' }, null, marker);
  const t = theme(state.themeId);
  const accent = t ? t.color : '#3a4152';
  const fillCount = state.fillCount || state.chain.length;

  for(let i = 0; i < state.chain.length; i++){
    const s = state.chain[i], p = chainPos(i, state.chain.length);
    const g = el('g', { class:'node', transform:`translate(${p.x - W/2},${p.y - H/2})`, 'data-id':s.id }, null, svg);
    const filled = i < fillCount;
    const color = CAT_COLORS[s.cat] || '#888';
    g.appendChild(el('rect', { x:0, y:0, width:W, height:H, rx:10, class:filled ? 'bg fill' : 'bg' }));
    const nm = g.appendChild(el('rect', { x:0, y:0, width:W, height:H, rx:10, class:'nm' }));
    nm.setAttribute('stroke', filled ? color : '#2a2f3d');
    if(state.sel === s.id) g.classList.add('sel');
    if(i === state.chain.length - 1 && s.type === '意义·需求') g.classList.add('loop');
const t1 = g.appendChild(el('text', { x:10, y:16, class:'cls' }, s.cat + ' · ' + s.type));
    t1.setAttribute('fill', filled ? color : '#6f788c');
    g.appendChild(el('text', { x:10, y:38, class:'cnt' }, filled ? s.content : '？待演绎'));
    g.appendChild(el('text', { x:10, y:58, class:'nid' }, s.id + ' ' + s.label));
    const outArr = state.edges.filter(e => e.from === s.id);
    g.appendChild(el('text', { x:W - 10, y:58, class:'nid o', 'text-anchor':'end' }, '出链 ' + outArr.length));
    const links = LINK[s.type] || [];
    const short = links.map(x => x.split('·')[1]);
    const lnkTxt = '链接：' + short.slice(0, 6).join('/') + (short.length > 6 ? '…+' + (short.length - 6) : '');
    const lnk = g.appendChild(el('text', { x:10, y:78, class:'lnk' }, lnkTxt));
    lnk.setAttribute('fill', filled ? '#8b93a7' : '#4b5366');
    g.setAttribute('title', links.map(to => PRED[s.type + '>' + to] + ' → ' + to).join('\n'));
    g.addEventListener('click', () => selectNode(s.id));
  }

  for(const e of state.edges){
    const ia = state.chain.findIndex(n => n.id === e.from), ib = state.chain.findIndex(n => n.id === e.to);
    if(ia < 0 || ib < 0) continue;
    const a = chainPos(ia, state.chain.length), b = chainPos(ib, state.chain.length);
    const fx = a.x, fy = a.y + H/2, tx = b.x, ty = b.y - H/2;
    const dx = tx - fx, dy = ty - fy, horiz = Math.abs(dx) > Math.abs(dy);
    const c1 = horiz ? `${fx + dx*0.45},${fy}` : `${fx},${fy + dy*0.45}`;
    const c2 = horiz ? `${tx - dx*0.45},${ty}` : `${tx},${ty - dy*0.45}`;
    const show = (ia < fillCount && ib < fillCount);
    const path = el('path', { d:`M${fx},${fy} C${c1} ${c2} ${tx},${ty}`, class:show ? 'edge show' : 'edge', 'marker-end':'url(#arrow)', 'data-edge':`${e.from}>${e.to}` }, null, svg);
    if(show) path.setAttribute('stroke', accent);
    const label = el('text', { x:(fx+tx)/2, y:(fy+ty)/2 - 6, class:show ? 'edge-label show' : 'edge-label', 'text-anchor':'middle', 'paint-order':'stroke', 'stroke':'#10131a', 'stroke-width':4 }, e.pred, svg);
    label.setAttribute('fill', show ? '#d7e0f0' : '#767f93');
  }
}

/* ---------- 任务合述（{预留字} 正则替换 · 由节点统一生成） ---------- */
const TYPE_TOKEN = {
  '意义·需求':'需求', '属性·环境':'环境', '实体·人物':'人物', '实体·组织':'组织', '实体·物品':'物品',
  '实体·讯息':'线索', '实体·异类':'怪异', '实体·地点':'地点', '属性·数量':'数量', '属性·时间':'时间',
  '约束·限制':'限制', '实体·障碍':'障碍', '属性·能力':'能力', '属性·状态':'状态', '关系·动作':'动作',
  '选择·道德选择':'选择', '意义·结果':'结果', '因果·代价':'代价', '因果·业力':'业力', '实体·事件':'事件'
};
const GENERIC_TEMPLATES = [
  '为{需求}，于{环境}遇{人物}，托{组织}之势，闻{线索}之传，其处{地点}，持有{物品}{数量}，带{状态}；须在{时间}{动作}，守{限制}，破{障碍}，凭{能力}成事。临{选择}之择：成则{结果}、付{代价}，{业力}随之；{事件}后，新{需求}又起，而{怪异}遁于暗处。',
  '{需求}：{人物}困于{环境}，落{状态}，闻{线索}，{组织}与之结约，留于{地点}，需{物品}{数量}；限{时间}，凭{能力}{动作}，守{限制}，与{障碍}相周旋；行至{选择}，得{结果}，付{代价}，{业力}随之；{怪异}窥伺其侧，{事件}，再起{需求}。',
  '{环境}之中，{人物}之{需求}未解；取{物品}{数量}，{时间}凭{能力}{动作}（{限制}），探至{地点}。{选择}一念，成{结果}、积{业力}；付{代价}以偿，闻{线索}而进，破{障碍}，托{组织}之助，携{状态}而行；{事件}毕，又生{需求}，而{怪异}环伺。'
];
const TOKEN_RE = /\{(需求|环境|人物|组织|物品|线索|怪异|地点|数量|时间|限制|障碍|能力|状态|动作|选择|结果|代价|业力|事件)\}/g;

function queueByToken(){
  const q = {};
  for(const n of state.chain){
    const tk = TYPE_TOKEN[n.type];
    if(tk) (q[tk] = q[tk] || []).push(n.content);
  }
  return q;
}
function cleanText(s, mc, tplIdx){
  const miss = tk => !!mc[tk];
  const missSlot = (tk, n) => (mc[tk] || []).includes(n);
  const isT2 = tplIdx % 3 === 1;
  s = s.replace(/\s{2,}/g, ' ');
  if(miss('环境')){
    s = miss('人物') ? s.replace(/于遇/g, '') : s.replace(/于遇/g, '遇');
    s = s.replace(/^之中[，、]?/, '');
  }
  if(miss('人物')){ s = s.replace(/遇[，、；]/g, ''); s = s.replace(/^之/, ''); s = s.replace(/([，、；])之/g, '$1'); }
  if(miss('物品')) s = s.replace(/持有[，、；]?/g, '');
  if(miss('物品')) s = s.replace(/取[，、]?/g, '');
  if(miss('地点')){ s = s.replace(/其处[，、]/g, '其'); s = s.replace(/留于[，、；]?/g, ''); s = s.replace(/探至[，、。；]?/g, ''); }
  if(miss('事件')){ s = s.replace(/^后[，、]?/, ''); s = s.replace(/毕[，、；，]/g, ''); s = s.replace(/毕$/, ''); }
  if(miss('选择')){ s = s.replace(/临之择/, ''); s = s.replace(/临[，、]?一念[，、]?/g, ''); s = s.replace(/行至[，、；]?/g, ''); s = s.replace(/：/g, ''); }
  if(miss('时间')) s = s.replace(/限(?=[，、；。])/g, '');
  if(miss('组织')) s = s.replace(/托之势[，、；]?|托之助[，、；]?/g, '');
  if(miss('线索')) s = s.replace(/闻(之传|而进)?(?=[，。；])/g, '');
  if(miss('怪异')) s = s.replace(/而遁于暗处[，。]?|窥伺其侧[，、；]?|而环伺[，。；]?/g, '');
  if(miss('障碍')) s = s.replace(/破(?=[，、；。])|与相周旋(?=[，、；])/g, '');
  if(miss('状态')) s = s.replace(/携而行[，、；]?/g, '').replace(/带(?=[，、；])|落(?=[，、；])|携(?=[，、；])/g, '');
  if(miss('代价')) s = s.replace(/付以偿[，、；]?/g, '').replace(/付(?=[，、。；])/g, '');
  if(isT2 && miss('能力')) s = s.replace(/凭/, '');
  if(tplIdx % 3 === 2 && miss('能力')) s = s.replace(/凭(?=[^，。；])/, '');
  if(missSlot('需求', 1)) s = s.replace(/^为[，、；]?/, '');
  if(missSlot('需求', 2)) s = s.replace(/毕[，、。；]?/g, '');
  s = s.replace(/新[，、]?又起/g, '');
  s = s.replace(/又生(?=[，。；]|$)/g, '');
  s = s.replace(/再起(?=[，。；]|$)/g, '');
  if(miss('时间') && miss('动作')) s = s.replace(/须在[，、]?/, '');
  if(miss('限制')) s = s.replace(/守[，、；]/g, '');
  if(miss('能力')) s = s.replace(/凭成事/, '成事');
  s = s.replace(/[，、；]{2,}/g, m => m[0]);
  s = s.replace(/（[，、；。]*）/g, '');
  s = s.replace(/[，、；]([。；])/g, '$1');
  s = s.replace(/^[，、；。：]+/g, '').replace(/[，、；]+$/g, '');
  s = s.replace(/([。；，、])\s*$/g, '。').replace(/。+/g, '。');
  if(!/。$/.test(s)) s += '。';
  return s;
}
function buildSentencePlain(){
  const q = queueByToken();
  const mc = {}, occ = {};
  const i = state.tplIdx;
  const tpl = GENERIC_TEMPLATES[i % GENERIC_TEMPLATES.length];
  const out = tpl.replace(TOKEN_RE, (m, tk) => {
    occ[tk] = (occ[tk] || 0) + 1;
    const v = (q[tk] || []).shift();
    if(!v) (mc[tk] = mc[tk] || []).push(occ[tk]);
    return v || '';
  });
  return cleanText(out, mc, i);
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function buildSentenceHtml(){
  let s = buildSentencePlain();
  for(const n of state.chain){
    if(!n.content) continue;
    const m = s.indexOf(n.content);
    if(m < 0) continue;
    s = s.slice(0, m) + '<span class="fv" title="' + (TYPE_TOKEN[n.type] || n.type) + '">' + n.content + '</span>' + s.slice(m + n.content.length);
  }
  return s;
}
function renderRecap(){
  const t = theme(state.themeId);
  if(!t){ $('#recap').innerHTML = '<div class="hint">未命中主题</div>'; return; }
  const reopened = state.chain[state.chain.length - 1];
  const looped = reopened && reopened.type === '意义·需求';
  const edgeLines = state.edges.map(e => {
    const a = nodeById(e.from), b = nodeById(e.to);
    return '<li><b>' + (a ? a.content : e.from) + '</b><span class="r-pred">' + e.pred + '</span><b>' + (b ? b.content : e.to) + '</b></li>';
  }).join('');
  const nodeLines = state.chain.map(n => '<li><b>' + n.label + '</b>：' + n.content + ' <span class="r-tag">' + n.type + '</span></li>').join('');
  $('#recap').innerHTML =
    '<div class="r-sentence">' + buildSentenceHtml() + '</div>' +
    '<div class="r-sub">合述模板 T' + (state.tplIdx % GENERIC_TEMPLATES.length + 1) + ' ｜ {预留字} 正则替换，缺失槽位自动清理</div>' +
    '<h3 class="r-h">链式经过（节点 —谓词→ 节点）</h3><ol class="r-steps">' + edgeLines + '</ol>' +
    '<h3 class="r-h">节点清单</h3><ol class="r-steps">' + nodeLines + '</ol>' +
    (looped ? '<div class="hint" style="margin-top:6px">回环完成：链尾再生新需求「' + reopened.content + '」，任务链可持续生长</div>' : '');
}

/* ---------- 结构体 ---------- */
function buildJSON(){
  const t = theme(state.themeId);
  const reopened = state.chain[state.chain.length - 1];
  const obj = {
    meta: { tool: '事件积木·肌理选择器', version: '0.3.3', mode: state.mode === 'roam' ? '随机漫游（逆序构建）' : '固定骨架示范',
            generation: '后置决定前置 · 缘起结构（此有故彼有）', atomModel: '21 原子 · 10 大类' },
    result: {
      theme: t.name, tagline: t.tagline, tone: t.tone, story: t.story,
      nodes: state.chain.map(n => ({ id: n.id, cat: n.cat, type: n.type, content: n.content })),
      edges: state.edges.map(e => ({
        from: e.from, fromContent: (nodeById(e.from) || {}).content || null,
        predicate: e.pred,
        to: e.to, toContent: (nodeById(e.to) || {}).content || null
      })),
      recap: {
        template: 'T' + (state.tplIdx % GENERIC_TEMPLATES.length + 1),
        sentence: buildSentencePlain(),
        edges: state.edges.map(e => ({
          from: (nodeById(e.from) || {}).content || e.from,
          predicate: e.pred,
          to: (nodeById(e.to) || {}).content || e.to
        })),
        steps: state.chain.map(n => ({ slot: n.label, type: n.type, value: n.content })),
        roamLog: state.roamLog
      },
      loop: reopened ? { from: state.edges.length ? state.edges[state.edges.length - 1].from : '', to: reopened.id,
        note: reopened.type === '意义·需求' ? '回环再生新需求，链可再生长' : '未回环（漫游提前收束）' } : null
    }
  };
  return JSON.stringify(obj, null, 2);
}
function emitJSON(){ $('#json').textContent = buildJSON(); }

/* ---------- 流程 ---------- */
async function apply(tid, animate = true){
  state.token++;
  const my = state.token;
  state.themeId = tid;
  renderThemes(); renderWordbank();
  if(!animate){
    const gen = state.mode === 'roam' ? roam(tid) : buildDemo(tid);
    state.chain = gen.chain; state.edges = gen.edges; state.roamLog = gen.log; state.fillCount = gen.chain.length;
    state.stage = 'done';
    selectNode(state.sel = state.chain[0] ? state.chain[0].id : null);
    render(); emitJSON(); renderRecap();
    setStatus('就绪', `${state.chain.length} 节点 / ${state.edges.length} 边`);
    return;
  }
  logReset();
  state.fillCount = 0;
  logActive(0);
  setStatus(state.mode === 'roam' ? '漫游生成' : '骨架', '');
  $('#stepProg').textContent = state.mode === 'roam'
    ? `🌐 随机漫游启动：从「${theme(tid).name}」词池（${theme(tid).pool.length} 节点）逆序构建，先定结局后推前置。`
    : `🏗 固定骨架「化缘链 v1」加载。`;
  render();
  await sleep(600); if(my !== state.token) return;
  logDone(0); logActive(1);
  if(state.mode === 'roam'){
    const gen = roam(tid);
    state.chain = gen.chain; state.edges = gen.edges; state.roamLog = gen.log;
    state.fillCount = 0;
    render();
    for(let i = 0; i < state.chain.length; i++){
      state.fillCount = i + 1;
      setStatus('漫游中', `${i + 1}/${state.chain.length}`);
      $('#stepProg').textContent = state.roamLog[Math.min(i, state.roamLog.length - 1)] || '';
      render();
      await sleep(130); if(my !== state.token) return;
    }
  } else {
    const gen = buildDemo(tid);
    state.chain = gen.chain; state.edges = gen.edges; state.roamLog = gen.log;
    $('#stepProg').textContent = `骨架就绪：${state.chain.length} 节点 / ${state.edges.length} 边。`;
    render();
    await sleep(400); if(my !== state.token) return;
  }
  logDone(1); logActive(2);
  setStatus('收束', '');
  $('#stepProg').textContent = state.mode === 'roam' ? '收束与回环：结果 → 业力 → 事件 → 新需求。结构体与任务合述已导出。' : '演绎完成。结构体与任务合述已导出。';
  state.stage = 'done';
  render(); emitJSON(); renderRecap();
  await sleep(350); if(my !== state.token) return;
  logDone(2); logActive(3);
  await sleep(250); if(my !== state.token) return;
  logDone(3);
}

function reroll(){
  if(!state.themeId) return;
  state.tplIdx++;
  const gen = state.mode === 'roam' ? roam(state.themeId) : buildDemo(state.themeId);
  state.chain = gen.chain; state.edges = gen.edges; state.roamLog = gen.log; state.fillCount = gen.chain.length;
  state.stage = 'done';
  render(); emitJSON(); renderRecap();
  $('#stepProg').textContent = state.mode === 'roam'
    ? `🔀 重新漫游：${state.chain.length} 节点 / ${state.edges.length} 边（新随机路径）。`
    : `🔀 骨架模式固定结构，逐字词重排（${state.themeId}）。`;
  if(state.sel) selectNode(state.sel);
}

/* ---------- 事件 ---------- */
$('#btnDice').addEventListener('click', () => {
  const others = THEMES.filter(t => t.id !== state.themeId);
  apply(others[Math.floor(Math.random() * others.length)].id);
});
$('#btnReroll').addEventListener('click', reroll);
$('#btnPlay').addEventListener('click', () => state.themeId && apply(state.themeId));
$('#btnMode').addEventListener('click', () => {
  state.mode = state.mode === 'roam' ? 'demo' : 'roam';
  $('#btnMode').textContent = state.mode === 'roam' ? '🏗 骨架对照' : '🌐 随机漫游';
  $('#stepProg').textContent = '';
  if(state.themeId) apply(state.themeId, false);
});
$('#btnCopy').addEventListener('click', doCopy);
$('#btnCopy2').addEventListener('click', doCopy);
$('#btnDl').addEventListener('click', doDownload);
$('#btnDl2').addEventListener('click', doDownload);

function doCopy(){
  const json = buildJSON();
  const done = () => { $('#btnCopy').textContent = '已复制 ✓'; $('#btnCopy2').textContent = '已复制 ✓'; setTimeout(() => { $('#btnCopy').textContent = '⧉ 复制结构'; $('#btnCopy2').textContent = '⧉ 复制'; }, 1200); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(done, () => fallbackCopy(json, done));
  } else fallbackCopy(json, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); done();
}
function doDownload(){
  const t = theme(state.themeId);
  const blob = new Blob([buildJSON()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.mode}-${t ? t.name : 'none'}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- 启动 ---------- */
apply(THEMES[0].id);

window.__t = { apply, roam, reroll, state, buildJSON, THEMES, LINK, PRED, TYPE_TOKEN, GENERIC_TEMPLATES, SLOTS };</script>
</body>
